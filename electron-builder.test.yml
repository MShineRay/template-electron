# 测试环境打包配置
appId: com.example.template-electron
productName: Template Electron (Test)
directories:
  output: release/test
files:
  - dist/**/*
  - package.json
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  # icon: assets/icon.icns  # 可选：测试环境图标（需要时取消注释并添加图标文件）
win:
  target:
    - nsis
    - portable
  # icon: assets/icon.ico  # 可选：测试环境图标
linux:
  target:
    - AppImage
    - deb
  # icon: assets/icon.png  # 可选：测试环境图标

# 测试环境版本号策略
# 版本号格式：1.0.0-beta.1
# 构建号：从环境变量 BUILD_VERSION 读取
# buildVersion: ${BUILD_VERSION}

# 测试环境特定配置
extraMetadata:
  name: template-electron-test

