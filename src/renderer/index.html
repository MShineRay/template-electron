<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electron 应用</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      /* 允许窗口拖动 */
      -webkit-app-region: drag;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      /* 容器内的内容区域不允许拖动 */
      -webkit-app-region: no-drag;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-align: center;
    }

    .info {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
    }

    .info-item {
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
    }

    button {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      /* 按钮区域不允许拖动，允许点击 */
      -webkit-app-region: no-drag;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Electron 应用</h1>
    
    <div class="info">
      <div class="info-item">
        <span>应用名称:</span>
        <span id="app-name">加载中...</span>
      </div>
      <div class="info-item">
        <span>应用版本:</span>
        <span id="app-version">加载中...</span>
      </div>
      <div class="info-item">
        <span>窗口状态:</span>
        <span id="window-state">加载中...</span>
      </div>
    </div>

    <div class="button-group">
      <button id="btn-minimize">最小化</button>
      <button id="btn-maximize">最大化/还原</button>
      <button id="btn-fullscreen">切换全屏</button>
      <button id="btn-close">关闭</button>
    </div>

    <div class="status" id="status">就绪</div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
